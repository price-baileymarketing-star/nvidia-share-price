<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nvidia share price, Oct 2025 to Nov 2026</title>
<style>
  html, body { margin: 0; }
  /* Fully self-contained: no scripts, no external calls. Scales to the iframe width. */
  svg { display: block; width: 100%; height: auto; font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<svg viewBox="0 0 760 360" role="img"
  aria-label="Line chart of Nvidia share price in US dollars from late October 2025 to November 2026. Four events are marked: first company to reach a 5 trillion dollar value in late October 2025 at about 207 dollars, record high near 238 dollars in early October 2026, board opens an investigation on 8 November 2026, and Jensen Huang resigns on 12 November 2026 closing at 166 dollars after an intraday low of 148.80 dollars.">

  <title>Nvidia share price, Oct 2025 to Nov 2026</title>
  <text x="56" y="22" font-size="15" fill="#1a1a1a">Nvidia share price, Oct 2025 to Nov 2026</text>
  <text x="56" y="40" font-size="12" fill="#555">Shares fell from a $238 record to a $166 close as Jensen Huang resigned</text>

  <!-- gridlines and y-axis labels -->
  <line x1="56" x2="740" y1="52"  y2="52"  stroke="#e5e5e5"/>
  <line x1="56" x2="740" y1="114" y2="114" stroke="#e5e5e5"/>
  <line x1="56" x2="740" y1="176" y2="176" stroke="#e5e5e5"/>
  <line x1="56" x2="740" y1="238" y2="238" stroke="#e5e5e5"/>
  <line x1="56" x2="740" y1="300" y2="300" stroke="#c3c2b7"/>
  <text x="50" y="56"  text-anchor="end" font-size="12" fill="#555">$260</text>
  <text x="50" y="118" text-anchor="end" font-size="12" fill="#555">$230</text>
  <text x="50" y="180" text-anchor="end" font-size="12" fill="#555">$200</text>
  <text x="50" y="242" text-anchor="end" font-size="12" fill="#555">$170</text>
  <text x="50" y="304" text-anchor="end" font-size="12" fill="#555">$140</text>
  <text x="18" y="176" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90 18 176)">Share price (USD)</text>

  <!-- x-axis month labels -->
  <text x="61.3"  y="318" text-anchor="middle" font-size="12" fill="#555">Nov 2025</text>
  <text x="169.7" y="318" text-anchor="middle" font-size="12" fill="#555">Jan 2026</text>
  <text x="274.5" y="318" text-anchor="middle" font-size="12" fill="#555">Mar 2026</text>
  <text x="382.9" y="318" text-anchor="middle" font-size="12" fill="#555">May 2026</text>
  <text x="491.3" y="318" text-anchor="middle" font-size="12" fill="#555">Jul 2026</text>
  <text x="601.4" y="318" text-anchor="middle" font-size="12" fill="#555">Sep 2026</text>
  <text x="709.8" y="318" text-anchor="middle" font-size="12" fill="#555">Nov 2026</text>

  <!-- price line -->
  <polyline fill="none" stroke="#008080" stroke-width="2"
    points="56,161.5 167.9,202.9 406,101.6 489.5,176 544.6,184.3 599.6,145 652.9,120.2 656.5,97.5 708,163.6 718.7,202.9 725.8,240.1 729.4,246.3"/>

  <!-- data points -->
  <circle cx="56"    cy="161.5" r="3" fill="#008080"/>
  <circle cx="167.9" cy="202.9" r="3" fill="#008080"/>
  <circle cx="406"   cy="101.6" r="3" fill="#008080"/>
  <circle cx="489.5" cy="176"   r="3" fill="#008080"/>
  <circle cx="544.6" cy="184.3" r="3" fill="#008080"/>
  <circle cx="599.6" cy="145"   r="3" fill="#008080"/>
  <circle cx="652.9" cy="120.2" r="3" fill="#008080"/>
  <circle cx="708"   cy="163.6" r="3" fill="#008080"/>
  <circle cx="718.7" cy="202.9" r="3" fill="#008080"/>
  <circle cx="725.8" cy="240.1" r="3" fill="#008080"/>

  <!-- intraday low mark -->

  <circle cx="729.4" cy="281.8" r="4" fill="#b70b4a"/>
  <text x="719.4" y="285.8" text-anchor="end" font-size="11" fill="#b70b4a">Intraday low $148.80</text>

  <!-- leader lines -->
  <line x1="56"    y1="161.5" x2="116" y2="127" stroke="#c3c2b7"/>
  <line x1="656.5" y1="97.5"  x2="532" y2="71"  stroke="#c3c2b7"/>
  <line x1="722.2" y1="219.4" x2="618" y2="161" stroke="#c3c2b7"/>
  <line x1="729.4" y1="246.3" x2="590" y2="221" stroke="#c3c2b7"/>

  <!-- event markers -->
  <circle cx="56"    cy="161.5" r="6" fill="#fcb53a" stroke="#008080" stroke-width="1.5"/>
  <circle cx="656.5" cy="97.5"  r="6" fill="#fcb53a" stroke="#008080" stroke-width="1.5"/>
  <circle cx="722.2" cy="219.4" r="6" fill="#fcb53a" stroke="#008080" stroke-width="1.5"/>
  <circle cx="729.4" cy="246.3" r="6" fill="#fcb53a" stroke="#008080" stroke-width="1.5"/>

  <!-- event labels -->
  <rect x="66"  y="112" width="100" height="30" rx="4" fill="#fcb53a"/>
  <text x="72"  y="125" font-size="11" fill="#008080">First to $5tn</text>
  <text x="72"  y="138" font-size="11" fill="#008080">Oct 2025</text>

  <rect x="470" y="56"  width="124" height="30" rx="4" fill="#fcb53a"/>
  <text x="476" y="69"  font-size="11" fill="#008080">Record high ~$238</text>
  <text x="476" y="82"  font-size="11" fill="#008080">(~$5.7tn)</text>

  <rect x="556" y="146" width="124" height="30" rx="4" fill="#fcb53a"/>
  <text x="562" y="159" font-size="11" fill="#b70b4a">Investigation opens</text>
  <text x="562" y="172" font-size="11" fill="#b70b4a">8 Nov</text>

  <rect x="512" y="206" width="156" height="30" rx="4" fill="#fcb53a"/>
  <text x="518" y="219" font-size="11" fill="#b70b4a">Huang resigns, 12 Nov</text>
  <text x="518" y="232" font-size="11" fill="#b70b4a">closed $166 (-4%)</text>
